name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译 Release APK
        working-directory: ./android-iptv
        run: gradle assembleRelease --no-daemon

      - name: 编译 Debug APK
        working-directory: ./android-iptv
        run: gradle assembleDebug --no-daemon

      - name: 收集 APK
        run: |
          mkdir -p out
          find android-iptv/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: out/*.apk
          retention-days: 90
