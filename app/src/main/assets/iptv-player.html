<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV 网页播放器</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1e222b;
    --line:#2a2f3a;
    --text:#e8eaed;
    --text-dim:#9aa3b2;
    --accent:#4f8cff;
    --accent-soft:rgba(79,140,255,.14);
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  /* ---------- 顶部栏 ---------- */
  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .logo{
    font-weight:700;
    font-size:16px;
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .spacer{flex:1;}
  button, .filebtn{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    transition:.15s;
    white-space:nowrap;
  }
  button:hover,.filebtn:hover{background:#262b36;border-color:#3a4150;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button.primary:hover{background:#3d7bef;}
  input[type=text]{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}

  /* ---------- 主体：左侧频道列表 / 右侧播放器 ---------- */
  main{flex:1;display:flex;min-height:0;}

  /* 左侧频道列表 */
  aside{
    width:320px;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    min-height:0;
    transition:width .2s;
  }
  aside.collapsed{width:0;min-height:0;border-right-color:transparent;overflow:hidden;}
  aside.collapsed .aside-top,
  aside.collapsed .group-bar,
  aside.collapsed .chan-list{display:none;}
  .aside-top{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;}
  .aside-top input{flex:1;}
  .group-bar{
    padding:8px 12px;
    display:flex;
    gap:6px;
    overflow-x:auto;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .group-bar::-webkit-scrollbar{display:none;}
  .chip{
    padding:5px 11px;
    border-radius:20px;
    background:var(--panel-2);
    border:1px solid var(--line);
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    color:var(--text-dim);
    transition:.15s;
  }
  .chip:hover{color:var(--text);}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
  .chan-list{flex:1;overflow-y:auto;padding:6px;}
  .chan{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 11px;
    border-radius:8px;
    cursor:pointer;
    transition:.12s;
    border:1px solid transparent;
  }
  .chan:hover{background:var(--panel-2);}
  .chan.active{background:var(--accent-soft);border-color:var(--accent);}
  .chan.active .chan-name{color:var(--accent);font-weight:600;}
  .chan-logo{
    width:36px;height:36px;
    border-radius:6px;
    background:var(--panel-2);
    object-fit:contain;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:var(--text-dim);overflow:hidden;
  }
  .chan-logo img{width:100%;height:100%;object-fit:contain;}
  .chan-meta{min-width:0;flex:1;}
  .chan-name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chan-group{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .empty-tip{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.8;}

  /* 播放区 */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    background:#000;
    min-width:0;
    min-height:0;
    overflow:hidden;
  }
  .video-wrap{flex:1;position:relative;background:#000;min-height:0;display:flex;align-items:center;justify-content:center;}
  video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000;display:block;}
  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    color:var(--text-dim);
    gap:12px;
    padding:30px;
    pointer-events:none;
  }
  .overlay .big{font-size:44px;opacity:.35;}
  .overlay.hide{display:none;}
  .nowplaying{
    position:absolute;top:0;left:0;right:0;
    padding:14px 18px;
    background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);
    font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:10px;
    pointer-events:none;
    transition:opacity .3s;
  }
  .nowplaying .live{
    font-size:10px;font-weight:700;color:#fff;
    background:var(--danger);padding:2px 6px;border-radius:4px;letter-spacing:.5px;
  }
  .status-bar{
    padding:8px 16px;
    background:var(--panel);
    border-top:1px solid var(--line);
    font-size:12px;color:var(--text-dim);
    display:flex;gap:18px;flex-wrap:wrap;align-items:center;
    flex-shrink:0;
  }
  .status-bar .ok{color:#4ade80;}
  .status-bar .err{color:var(--danger);}

  /* ---------- 导入弹窗 ---------- */
  .modal-mask{
    position:fixed;inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-mask.show{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    width:min(620px,100%);
    max-height:88vh;
    overflow-y:auto;
    padding:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .modal h2{margin:0 0 4px;font-size:18px;}
  .modal .sub{color:var(--text-dim);font-size:12.5px;margin-bottom:20px;line-height:1.6;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px;}
  .field input,.field textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    outline:none;
    font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:120px;font-family:ui-monospace,Consolas,monospace;}
  .field input:focus,.field textarea:focus{border-color:var(--accent);}
  .or{display:flex;align-items:center;gap:12px;color:var(--text-dim);font-size:12px;margin:18px 0;}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .drop{
    border:2px dashed var(--line);
    border-radius:10px;
    padding:26px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
    transition:.15s;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text);}
  .sample-links{font-size:12px;margin-top:6px;}
  .sample-links a{color:var(--accent);text-decoration:none;margin-right:12px;cursor:pointer;}
  .sample-links a:hover{text-decoration:underline;}

  /* 滚动条 */
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#333a47;border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#414a5a;}

  /* 移动端 */
  @media(max-width:760px){
    main{flex-direction:column;}
    aside{width:100%;max-height:36vh;border-right:none;border-bottom:1px solid var(--line);}
    aside.collapsed{width:100%;max-height:0;}
    .stage{flex:1;}
    header{padding:10px 12px;gap:8px;}
    .logo{font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span>IPTV 网页播放器</div>
  <div class="spacer"></div>
  <button id="openImport" class="primary">导入播放列表</button>
  <button id="prevBtn" title="上一个频道">◀ 上一台</button>
  <button id="nextBtn" title="下一个频道">下一台 ▶</button>
</header>

<main>
  <aside id="chanPanel">
    <div class="aside-top">
      <input type="text" id="search" placeholder="搜索频道…">
      <button id="togglePanel" title="收起/展开频道列表">收起 ◀</button>
    </div>
    <div class="group-bar" id="groupBar"></div>
    <div class="chan-list" id="chanList">
      <div class="empty-tip">
        还没有频道<br>
        点击右上角「导入播放列表」<br>
        支持本地 .m3u/.m3u8 文件、URL 或直接粘贴
      </div>
    </div>
  </aside>

  <div class="stage">
    <div class="video-wrap">
      <video id="video" controls playsinline></video>
      <div class="nowplaying" id="nowPlaying" style="display:none">
        <span class="live">LIVE</span>
        <span id="npName"></span>
      </div>
      <div class="overlay" id="overlay">
        <div class="big">📺</div>
        <div>导入播放列表后，点击左侧频道即可播放</div>
      </div>
    </div>
    <div class="status-bar">
      <span id="statusText">就绪</span>
      <span id="statCount"></span>
      <span id="statPlaying"></span>
    </div>
  </div>
</main>

<!-- 导入弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h2>导入播放列表</h2>
    <div class="sub">播放列表需自行准备（运营商 IPTV 账号、自建转发源或已获授权的服务）。本页面只负责解析与播放，不内置任何频道源。</div>

    <div class="field">
      <label>方式一：拖入或选择本地文件（.m3u / .m3u8 / .txt）</label>
      <div class="drop" id="drop">
        点击选择文件，或把文件拖到这里
        <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none">
      </div>
    </div>

    <div class="or">或</div>

    <div class="field">
      <label>方式二：播放列表 URL（m3u/m3u8 在线地址）</label>
      <input type="text" id="urlInput" placeholder="https://example.com/playlist.m3u">
      <div class="sample-links">
        试试公开示例：
        <a data-url="https://iptv-org.github.io/iptv/index.m3u">iptv-org 全球公开源</a>
        <a data-url="https://iptv-org.github.io/iptv/countries/cn.m3u">中国频道</a>
      </div>
    </div>

    <div class="or">或</div>

    <div class="field">
      <label>方式三：直接粘贴 m3u 文本内容</label>
      <textarea id="textInput" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;...&quot; group-title=&quot;央视&quot;,CCTV-1&#10;http://..."></textarea>
    </div>

    <div class="modal-actions">
      <button id="cancelImport">取消</button>
      <button id="loadUrl" >加载 URL</button>
      <button id="loadText" class="primary">解析粘贴内容</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var video       = document.getElementById('video');
  var overlay     = document.getElementById('overlay');
  var nowPlaying  = document.getElementById('nowPlaying');
  var npName      = document.getElementById('npName');
  var chanListEl  = document.getElementById('chanList');
  var groupBar    = document.getElementById('groupBar');
  var searchInput = document.getElementById('search');
  var statusText  = document.getElementById('statusText');
  var statCount   = document.getElementById('statCount');
  var statPlaying = document.getElementById('statPlaying');
  var modalMask   = document.getElementById('modalMask');

  var channels = [];       // {name, url, logo, group, id}
  var filtered = [];
  var curGroup = '__all__';
  var curIndex = -1;
  var hls = null;

  /* ---------------- 工具 ---------------- */
  function setStatus(msg, cls){
    statusText.textContent = msg;
    statusText.className = cls||'';
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------- m3u 解析 ---------------- */
  function parseM3U(text){
    var lines = text.replace(/\r/g,'').split('\n');
    var out = [];
    var pending = null;
    var id = 0;

    for(var i=0;i<lines.length;i++){
      var line = lines[i].trim();
      if(!line) continue;

      if(/^#EXTINF/i.test(line)){
        var attrPart = line.substring(line.indexOf(':')+1);
        var commaIdx = attrPart.lastIndexOf(',');
        var attrs = commaIdx>=0 ? attrPart.substring(0,commaIdx) : '';
        var name  = commaIdx>=0 ? attrPart.substring(commaIdx+1).trim() : '';

        var logo  = getAttr(attrs,'tvg-logo');
        var group = getAttr(attrs,'group-title');
        var tvgName = getAttr(attrs,'tvg-name');
        if(!name) name = tvgName || '未命名频道';

        pending = { name:name, logo:logo, group:group||'未分组' };
        continue;
      }

      if(/^#EXTGRP:/i.test(line)){
        if(pending) pending.group = line.substring(8).trim() || '未分组';
        continue;
      }

      if(line.charAt(0)==='#'){
        // 其它指令（如 #KODIPROP）暂略
        continue;
      }

      // 这是一条 URL
      if(pending){
        pending.url = line;
        pending.id = id++;
        out.push(pending);
        pending = null;
      } else {
        // 没有 EXTINF 的裸 URL，用 URL 末段做名字
        out.push({ name: shortNameFromUrl(line), url:line, logo:'', group:'未分组', id:id++ });
      }
    }
    return out;
  }

  function getAttr(attrStr, key){
    var m = attrStr.match(new RegExp(key+'\\s*=\\s*"([^"]*)"','i'));
    return m ? m[1] : '';
  }

  function shortNameFromUrl(u){
    try{
      var p = u.split('?')[0].split('/');
      return decodeURIComponent(p[p.length-1] || u);
    }catch(e){ return u; }
  }

  /* ---------------- 渲染 ---------------- */
  function applyFilters(){
    var kw = searchInput.value.trim().toLowerCase();
    filtered = channels.filter(function(c){
      if(curGroup!=='__all__' && c.group !== curGroup) return false;
      if(kw && c.name.toLowerCase().indexOf(kw)<0) return false;
      return true;
    });
    renderList();
  }

  function renderGroups(){
    var groups = [];
    var seen = {};
    channels.forEach(function(c){
      if(!seen[c.group]){ seen[c.group]=1; groups.push(c.group); }
    });
    groups.sort();

    var html = '<span class="chip'+(curGroup==='__all__'?' active':'')+'" data-g="__all__">全部 ('+channels.length+')</span>';
    groups.forEach(function(g){
      var n = channels.filter(function(c){return c.group===g;}).length;
      html += '<span class="chip'+(curGroup===g?' active':'')+'" data-g="'+esc(g)+'">'+esc(g)+' ('+n+')</span>';
    });
    groupBar.innerHTML = html;

    Array.prototype.forEach.call(groupBar.querySelectorAll('.chip'), function(el){
      el.onclick = function(){
        curGroup = el.getAttribute('data-g');
        renderGroups();
        applyFilters();
      };
    });
  }

  function renderList(){
    if(filtered.length===0){
      chanListEl.innerHTML = '<div class="empty-tip">'+(channels.length?'没有匹配的频道':'还没有频道')+'</div>';
      return;
    }
    var frag = document.createDocumentFragment();
    filtered.forEach(function(c){
      var div = document.createElement('div');
      div.className = 'chan' + (c.id===curIndex?' active':'');
      div.dataset.id = c.id;

      var logoHtml = c.logo
        ? '<img src="'+esc(c.logo)+'" onerror="this.parentNode.textContent=\'📺\';this.remove()">'
        : '📺';

      div.innerHTML =
        '<div class="chan-logo">'+logoHtml+'</div>'+
        '<div class="chan-meta">'+
          '<div class="chan-name">'+esc(c.name)+'</div>'+
          '<div class="chan-group">'+esc(c.group)+'</div>'+
        '</div>';

      div.onclick = function(){ playChannel(c.id); };
      frag.appendChild(div);
    });
    chanListEl.innerHTML = '';
    chanListEl.appendChild(frag);
  }

  /* ---------------- 播放 ---------------- */
  function destroyHls(){
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  }

  function playChannel(id){
    var ch = channels.find(function(c){return c.id===id;});
    if(!ch) return;

    curIndex = id;
    // 更新高亮
    Array.prototype.forEach.call(chanListEl.querySelectorAll('.chan'), function(el){
      el.classList.toggle('active', Number(el.dataset.id)===id);
    });

    overlay.classList.add('hide');
    nowPlaying.style.display = 'flex';
    npName.textContent = ch.name;
    statPlaying.textContent = '正在播放：'+ch.name;
    setStatus('加载中…');

    var url = ch.url;
    destroyHls();

    var isM3U8 = /\.m3u8(\?|$)/i.test(url);

    if(isM3U8 && window.Hls && Hls.isSupported()){
      hls = new Hls({lowLatencyMode:true, enableWorker:true});
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){
        video.play().catch(function(){});
        setStatus('播放中（HLS）','ok');
      });
      hls.on(Hls.Events.ERROR, function(evt, data){
        if(data && data.fatal){
          if(data.type === Hls.ErrorTypes.NETWORK_ERROR){ hls.startLoad(); }
          else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
          else {
            setStatus('播放失败：'+data.details,'err');
            destroyHls();
          }
        }
      });
    } else {
      video.src = url;
      video.play().catch(function(){
        // 浏览器可能因自动播放策略阻止，用户点击播放键即可
      });
      video.onloadeddata = function(){ setStatus('播放中','ok'); };
      video.onerror = function(){
        setStatus('无法播放该源（可能是格式不支持或需要鉴权）','err');
      };
    }
  }

  function step(dir){
    if(filtered.length===0) return;
    var pos = filtered.findIndex(function(c){return c.id===curIndex;});
    if(pos<0) pos = -1;
    var next = (pos + dir + filtered.length) % filtered.length;
    playChannel(filtered[next].id);
  }

  document.getElementById('prevBtn').onclick = function(){ step(-1); };
  document.getElementById('nextBtn').onclick = function(){ step(1); };

  // 频道面板收起/展开
  var chanPanel = document.getElementById('chanPanel');
  var togglePanelBtn = document.getElementById('togglePanel');
  togglePanelBtn.onclick = function(){
    var collapsed = chanPanel.classList.toggle('collapsed');
    togglePanelBtn.textContent = collapsed ? '展开 ▶' : '收起 ◀';
  };

  /* ---------------- 导入逻辑 ---------------- */
  function loadChannels(list, sourceLabel){
    if(!list.length){
      setStatus('未解析到任何频道，请检查文件格式','err');
      return;
    }
    channels = list;
    curGroup = '__all__';
    curIndex = -1;
    searchInput.value = '';
    destroyHls();
    video.removeAttribute('src');
    video.load();
    overlay.classList.remove('hide');
    nowPlaying.style.display='none';
    statPlaying.textContent='';

    renderGroups();
    applyFilters();

    statCount.textContent = '共 '+channels.length+' 个频道';
    setStatus('已加载：'+sourceLabel+'（'+channels.length+' 个频道）','ok');
    closeModal();
  }

  function openModal(){ modalMask.classList.add('show'); }
  function closeModal(){ modalMask.classList.remove('show'); }

  document.getElementById('openImport').onclick = openModal;
  document.getElementById('cancelImport').onclick = closeModal;
  modalMask.onclick = function(e){ if(e.target===modalMask) closeModal(); };

  // 文件选择
  var fileInput = document.getElementById('fileInput');
  var drop = document.getElementById('drop');
  drop.onclick = function(){ fileInput.click(); };
  fileInput.onchange = function(){
    if(fileInput.files[0]) readFile(fileInput.files[0]);
  };
  ['dragenter','dragover'].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop',function(e){
    if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  function readFile(file){
    var fr = new FileReader();
    fr.onload = function(){ loadChannels(parseM3U(fr.result), file.name); };
    fr.readAsText(file, 'utf-8');
  }

  // URL 加载
  document.getElementById('loadUrl').onclick = function(){
    var u = document.getElementById('urlInput').value.trim();
    if(!u){ setStatus('请先填写播放列表 URL','err'); return; }
    setStatus('正在下载播放列表…');
    fetch(u)
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(t){ loadChannels(parseM3U(t), u.split('/').pop()||u); })
      .catch(function(err){
        setStatus('下载失败：'+err.message+'（可能被跨域策略阻止，可改用本地文件）','err');
      });
  };

  // 示例链接
  Array.prototype.forEach.call(document.querySelectorAll('.sample-links a'), function(a){
    a.onclick = function(){
      document.getElementById('urlInput').value = a.getAttribute('data-url');
    };
  });

  // 粘贴文本
  document.getElementById('loadText').onclick = function(){
    var t = document.getElementById('textInput').value.trim();
    if(!t){ setStatus('请先粘贴 m3u 内容','err'); return; }
    if(t.indexOf('#EXTM3U')<0 && t.indexOf('#EXTINF')<0){
      setStatus('内容看起来不是 m3u 格式','err'); return;
    }
    loadChannels(parseM3U(t), '粘贴内容');
  };

  // 搜索
  searchInput.oninput = applyFilters;

  // 键盘快捷键
  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
    if(e.key==='ArrowUp'){ e.preventDefault(); step(-1); }
    if(e.key==='ArrowDown'){ e.preventDefault(); step(1); }
  });

  // 供 Android 壳的返回键调用：若弹窗打开则关闭并拦截返回
  window.__iptvBack = function(){
    if(modalMask.classList.contains('show')){ closeModal(); return true; }
    return false;
  };
})();
</script>
</body>
</html>
